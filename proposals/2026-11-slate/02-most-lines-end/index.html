<!doctype html><html><head><meta charset="utf-8"><title>Clyde — Most Lines End (proposal demo)</title>
<style>html,body{margin:0;background:#ddd9d0;display:flex;justify-content:center;align-items:center;min-height:100vh}</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script></head><body><script>
// MOST LINES END — a Bienaymé–Galton–Watson branching process drawn as a descent chart.
// Rule: each person in generation g has k children, k ~ Poisson(m), m close to 1 (the critical case).
// The chart is redrawn until at least one line reaches the bottom row: the viewer's row.
const SEED=new URLSearchParams(location.search).get('seed')||'clyde';
function rng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let t=h>>>0;return()=>{t=t+0x6D2B79F5|0;let r=Math.imul(t^t>>>15,1|t);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
const R=rng(SEED),rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1));
function poisson(m){let L=Math.exp(-m),k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
const W=800,H=1000,N=ri(18,34),G=ri(12,18),m=rr(0.92,1.02);
let gens,tries=0;
function run(){gens=[[]];for(let i=0;i<N;i++)gens[0].push({a:i/N,b:(i+1)/N,kids:[],alive:false});
  for(let g=1;g<G;g++){gens[g]=[];for(const p of gens[g-1]){const k=Math.min(poisson(m),5);
    for(let j=0;j<k;j++){const c={a:p.a+(p.b-p.a)*j/k,b:p.a+(p.b-p.a)*(j+1)/k,kids:[],alive:false,par:p};p.kids.push(c);gens[g].push(c)}}
    if(gens[g].length>140)return false}
  const last=gens[G-1];if(last.length<1||last.length>7)return false;
  for(const c of last){let q=c;while(q){q.alive=true;q=q.par}}
  if(gens[0].filter(n=>n.alive).length>2){for(const r of gens)for(const n of r)n.alive=false;return false}return true}
while(!run()&&tries<4000)tries++;
function setup(){createCanvas(W,H);pixelDensity(2);background('#f1eee6');
  const X0=70,X1=W-70,Y0=90,Y1=H-120,X=u=>X0+(X1-X0)*((u)),Y=g=>Y0+(Y1-Y0)*g/(G-1);
  for(const row of gens){row.sort((p,q)=>p.a-q.a);row.forEach((n,i)=>n.x=X((i+0.5)/row.length))}
  const cx=n=>n.x;noFill();
  for(const pass of [0,1])for(let g=0;g<G;g++)for(const n of gens[g]){
    if(n.alive!==!!pass)continue;
    stroke(pass?color(24,22,20):color(24,22,20,70));strokeWeight(pass?1.3:0.8);
    const x=cx(n),y=Y(g);
    for(const c of n.kids){const x2=cx(c),y2=Y(g+1);bezier(x,y,x,y+(y2-y)*0.55,x2,y2-(y2-y)*0.55,x2,y2)}
    if(!n.kids.length&&g<G-1)line(x-3,y,x+3,y);           // a line ends
    else if(g<G-1){strokeWeight(pass?3.2:2.2);point(x,y)}
    if(g===G-1){fill(24,22,20);noStroke();circle(x,y,5);noFill()}}
  noStroke();fill(24,22,20,110);textFont('monospace');textSize(11);
  const ended=gens[0].filter(n=>!n.alive).length;
  text(`${N} people in the first row · ${G} generations · m = ${m.toFixed(2)} · ${ended} of ${N} lines ended · seed ${SEED}`,X0,H-60);
  window.__done=true}
</script></body></html>
