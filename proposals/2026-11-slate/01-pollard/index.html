<!doctype html><html><head><meta charset="utf-8"><title>Clyde — Pollard (proposal demo)</title>
<style>html,body{margin:0;background:#ddd9d0;display:flex;justify-content:center;align-items:center;min-height:100vh}</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script></head><body><script>
// POLLARD — an L-system whose most important rule is the cut.
// Symbols: I wood internode, K knuckle (one K per cut it has survived), [ ] branch, s shoot apex, i shoot internode.
// Yearly rules:  s -> i s  (and sometimes i[s]s once a shoot is a year old);  K (bare) -> K[s][s]...[s]
// Cut year (every c years): delete every bracketed group that follows a K, then K -> KK.
const SEED=new URLSearchParams(location.search).get('seed')||'clyde';
function rng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let t=h>>>0;return()=>{t=t+0x6D2B79F5|0;let r=Math.imul(t^t>>>15,1|t);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
const R=rng(SEED),rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1));
const W=800,H=1000;
const limbs=ri(2,5),cutEvery=ri(2,4),cuts=ri(2,9),since=ri(0,cutEvery-1);
const years=cuts*cutEvery+since;
function axiom(){let s=['I','I','I','I','I'];for(let k=0;k<limbs;k++)s.push('[','I','I','K',']');return s}
function grow(t,age){const o=[];for(let n=0;n<t.length;n++){const c=t[n];
  if(c==='s'){o.push('i','i','i');if(age>0&&R()<0.3)o.push('[','i','i','s',']');o.push('s')}
  else if(c==='K'&&t[n+1]!=='K'&&t[n+1]!=='['){o.push('K');const k=ri(9,20);for(let j=0;j<k;j++)o.push('[','i','i','i','i','s',']')}
  else o.push(c)}return o}
function cut(t){const o=[];for(let n=0;n<t.length;n++){const c=t[n];o.push(c);
  if(c==='K'&&t[n+1]!=='K'){o.push('K');while(t[n+1]==='['){let d=0;do{n++;if(t[n]==='[')d++;if(t[n]===']')d--}while(d>0)}}}return o}
let T=axiom(),age=0;
for(let y=1;y<=years;y++){if(y%cutEvery===0&&y<=cuts*cutEvery){T=cut(T);age=0}else{T=grow(T,age);age++}}
function setup(){createCanvas(W,H);pixelDensity(2);background('#f1eee6');
  const ink=color(28,26,24),gy=H*0.9;stroke(ink);strokeWeight(1);line(70,gy,W-70,gy);
  for(let x=80;x<W-80;x+=rr(3,9))line(x,gy+rr(2,5),x+rr(2,6),gy+rr(2,5));
  // turtle
  let st=[],x=W/2+rr(-40,40),y=gy,a=-HALF_PI+rr(-0.05,0.05),depth=0,limbIdx=0,wood=rr(24,32);
  const trunkLen=rr(62,80),limbLen=rr(40,70);
  stroke(ink);strokeWeight(1);fill(ink);
  for(let n=0;n<T.length;n++){const c=T[n];
    if(c==='['){st.push([x,y,a,depth,wood]);depth++;
      if(depth===1){a=-HALF_PI+map(limbIdx++,0,limbs-1||1,-0.6,0.6)*(limbs>1?1:0)+rr(-0.12,0.12);wood*=0.6}
      else a+=rr(-0.5,0.5)}
    else if(c===']'){[x,y,a,depth,wood]=st.pop()}
    else if(c==='I'){const L=depth?limbLen:trunkLen,w2=wood*0.9;const nx=x+cos(a)*L,ny=y+sin(a)*L;
      const px=-sin(a),py=cos(a);beginShape();vertex(x+px*wood/2,y+py*wood/2);vertex(nx+px*w2/2,ny+py*w2/2);vertex(nx-px*w2/2,ny-py*w2/2);vertex(x-px*wood/2,y-py*wood/2);endShape(CLOSE);
      x=nx;y=ny;wood=w2;a+=rr(-0.08,0.08)+(depth?(-HALF_PI-a)*0.12:0)}
    else if(c==='K'){let k=0;while(T[n+1]==='K'){k++;n++}const r=wood*0.55+k*2.2;
      for(let j=0;j<6+k*2;j++){const q=rr(0,TWO_PI),d=rr(0,r*0.6);ellipse(x+cos(q)*d,y+sin(q)*d-r*0.3,r*rr(0.7,1.3),r*rr(0.6,1.1))}
      y-=r*0.6;wood=1.6}
    else if(c==='i'){const L=rr(11,18);const nx=x+cos(a)*L,ny=y+sin(a)*L;stroke(ink);strokeWeight(max(0.7,wood));line(x,y,nx,ny);strokeWeight(1);
      x=nx;y=ny;a+=rr(-0.06,0.06)+(-HALF_PI-a)*0.18;wood*=0.96}}
  noStroke();fill(90);textFont('monospace');textSize(11);
  text(`cut every ${cutEvery} yrs · ${cuts} cuts · ${since} yr${since==1?'':'s'} since the last · seed ${SEED}`,70,H-40);
  window.__done=true}
</script></body></html>
