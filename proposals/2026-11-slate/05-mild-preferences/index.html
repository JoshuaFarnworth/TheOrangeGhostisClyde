<!doctype html><html><head><meta charset="utf-8"><title>Clyde — Mild Preferences (proposal demo)</title>
<style>html,body{margin:0;background:#ddd9d0;display:flex;justify-content:center;align-items:center;min-height:100vh}</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script></head><body><script>
// MILD PREFERENCES — Schelling's segregation model on the windows of one block of flats.
// Rule: a household is content if at least t of its occupied neighbours (8 around its window) hang curtains like its own.
// A discontented household moves to an empty flat where it would be content (any empty flat if none). t is mild (a third to a half). Left: moving-in day. Right: years later.
const SEED=new URLSearchParams(location.search).get('seed')||'clyde';
function rng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let t=h>>>0;return()=>{t=t+0x6D2B79F5|0;let r=Math.imul(t^t>>>15,1|t);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
const R=rng(SEED),rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),pick=a=>a[Math.floor(R()*a.length)];
const W=800,H=1000,PAPER='#f1eee6';
function label(s){push();noStroke();fill(30,28,26,140);textFont('monospace');textSize(11);textAlign(LEFT);text(s+' · seed '+SEED,60,H-40);pop()}
const C=9,F=13,t=rr(0.3,0.5),vac=rr(0.08,0.16);
const cur=pick([['#c9a24a','#7f9cb0'],['#b5553c','#d8cfb8'],['#6d8a5a','#d2a878'],['#a7656e','#e0d6be']]);
let g=[];for(let i=0;i<C*F;i++)g.push(R()<vac?0:(R()<0.5?1:2));const start=g.slice();
const nb=(G,i)=>{const x=i%C,y=(i/C)|0;let s=0,n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;
  const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=C||Y>=F)continue;const v=G[Y*C+X];if(v){n++;if(v===G[i])s++}}return n?s/n:1};
let moves=0,rounds=0;for(;rounds<6000;rounds++){const un=[];for(let i=0;i<g.length;i++)if(g[i]&&nb(g,i)<t)un.push(i);if(!un.length)break;
  const i=pick(un),em=[],good=[];for(let j=0;j<g.length;j++)if(!g[j]){em.push(j);g[j]=g[i];if(nb(g,j)>=t)good.push(j);g[j]=0}
  const j=pick(good.length?good:em);g[j]=g[i];g[i]=0;moves++}
let same=0,tot=0;for(let i=0;i<g.length;i++)if(g[i]){same+=nb(g,i);tot++}
function block(G,x0,y0,ww,hh){const cw=ww/C,fh=hh/F;stroke(40,36,32);strokeWeight(1.2);fill('#d9d2c4');rect(x0-12,y0-18,ww+24,hh+30);
  for(let i=0;i<G.length;i++){const x=x0+(i%C)*cw+cw*0.22,y=y0+((i/C)|0)*fh+fh*0.2,w=cw*0.56,h=fh*0.62;
    stroke(40,36,32);strokeWeight(0.9);fill(G[i]?cur[G[i]-1]:'#3a3734');rect(x,y,w,h);
    if(G[i]){stroke(255,255,255,90);line(x+w/2,y+1,x+w/2,y+h-1)}}
  noStroke();fill(40,36,32);rect(x0+ww/2-10,y0+hh-4,20,16)}
function setup(){createCanvas(W,H);pixelDensity(2);background(PAPER);
  block(start,70,150,300,620);block(g,430,150,300,620);
  noStroke();fill(30,28,26,150);textFont('monospace');textSize(12);text('moving-in day',70,810);text('years later',430,810);
  label(`each household wants ≥ ${Math.round(t*100)}% like itself · ${moves} moves · now ${Math.round(same/tot*100)}% like-neighbours`);window.__done=true}

</script></body></html>
