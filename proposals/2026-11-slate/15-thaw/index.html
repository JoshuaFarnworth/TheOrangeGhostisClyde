<!doctype html><html><head><meta charset="utf-8"><title>Clyde — Thaw (proposal demo)</title>
<style>html,body{margin:0;background:#ddd9d0;display:flex;justify-content:center;align-items:center;min-height:100vh}</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script></head><body><script>
// THAW — site percolation (Broadbent & Hammersley 1957) on a frozen pond over four mornings.
// Rule: each patch of ice has a fixed thickness. Each morning it is a little warmer and the thinnest patches open.
// The pond can be crossed while a chain of holding patches joins the near bank to the far one. On a square grid
// that chain vanishes suddenly as the holding fraction falls through about 59%.
const SEED=new URLSearchParams(location.search).get('seed')||'clyde';
function rng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let t=h>>>0;return()=>{t=t+0x6D2B79F5|0;let r=Math.imul(t^t>>>15,1|t);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
const R=rng(SEED),rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),pick=a=>a[Math.floor(R()*a.length)];
const W=800,H=1000,PAPER='#f1eee6';
function label(s){push();noStroke();fill(30,28,26,140);textFont('monospace');textSize(11);textAlign(LEFT);text(s+' · seed '+SEED,60,H-40);pop()}
const G=46,th=[];for(let i=0;i<G*G;i++)th.push(R());const pc=0.5927,mornings=[rr(0.7,0.78),rr(0.62,0.67),pc+rr(-0.02,0.02),rr(0.5,0.55)];
const cx=G/2,cy=G/2,ph=[rr(0,6),rr(0,6)];
const inPond=(x,y)=>{const a=Math.atan2(y-cy,x-cx),r=G*0.47*(1+0.08*Math.sin(2*a+ph[0])+0.05*Math.sin(3*a+ph[1]));return Math.hypot(x-cx,y-cy)<r};
function cross(p){const hold=i=>th[i]<p,seen=new Int32Array(G*G).fill(-1),q=[];
  for(let x=0;x<G;x++)for(let y=0;y<G;y++){const i=y*G+x;if(inPond(x,y)&&!inPond(x-1,y)&&hold(i)){seen[i]=i;q.push(i)}}
  while(q.length){const i=q.shift(),x=i%G,y=(i/G)|0;if(!inPond(x+1,y)&&x>cx){const path=[];let j=i;while(seen[j]!==j){path.push(j);j=seen[j]}path.push(j);return path}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy,j=Y*G+X;if(X>=0&&Y>=0&&X<G&&Y<G&&inPond(X,Y)&&hold(j)&&seen[j]<0){seen[j]=i;q.push(j)}}}return null}
function pond(p,x0,y0,s){const path=cross(p);noStroke();fill('#a99f86');rect(x0-6,y0-6,G*s+12,G*s+12,6);
  for(let y=0;y<G;y++)for(let x=0;x<G;x++){if(!inPond(x,y))continue;const i=y*G+x;fill(th[i]<p?color(222,228,230):color(46,62,70));rect(x0+x*s,y0+y*s,s+0.4,s+0.4)}
  if(path){stroke(190,70,40);strokeWeight(3);noFill();beginShape();for(const i of path)vertex(x0+(i%G+0.5)*s,y0+(((i/G)|0)+0.5)*s);endShape()}
  noStroke();fill(30,28,26,150);textFont('monospace');textSize(11);text(`${Math.round(p*100)}% holding · ${path?'crossable':'not crossable'}`,x0,y0+G*s+22);return !!path}
function setup(){createCanvas(W,H);pixelDensity(2);background(PAPER);const s=7.2;let n=0;
  mornings.forEach((p,i)=>{n+=pond(p,70+(i%2)*360,90+Math.floor(i/2)*420,s)?1:0});
  label(`one pond, four mornings · crossable on ${n} of 4`);window.__done=true}

</script></body></html>
